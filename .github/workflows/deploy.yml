name: Deploy

on:
  push:
    branches: [main, staging]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements-dev.txt
      - run: python -m pytest -q

  deploy-prod:
    needs: test
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      # The key is stored base64-encoded (DEPLOY_SSH_KEY_B64) and decoded into a
      # file here instead of passed as multiline text — a multiline GitHub
      # secret is fragile to copy-paste (a dropped newline silently breaks it
      # with no useful error), a single-line base64 blob isn't.
      - name: Write deploy key
        run: |
          echo "${{ secrets.DEPLOY_SSH_KEY_B64 }}" | base64 -d > /tmp/deploy_key
          chmod 600 /tmp/deploy_key
      - name: Deploy to production
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.DEPLOY_HOST }}
          username: ${{ secrets.DEPLOY_USER }}
          key_path: /tmp/deploy_key
          script: /home/vecherinka/deploy.sh

  deploy-staging:
    needs: test
    if: github.ref == 'refs/heads/staging'
    runs-on: ubuntu-latest
    steps:
      - name: Write deploy key
        run: |
          echo "${{ secrets.DEPLOY_STAGING_SSH_KEY_B64 }}" | base64 -d > /tmp/deploy_key
          chmod 600 /tmp/deploy_key
          echo "decoded key byte count: $(wc -c < /tmp/deploy_key)"
          ssh-keygen -l -f /tmp/deploy_key || echo "ssh-keygen could not parse the decoded key"
      - name: Deploy to staging
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.DEPLOY_HOST }}
          username: ${{ secrets.DEPLOY_STAGING_USER }}
          key_path: /tmp/deploy_key
          script: /home/vecherinka/deploy-staging.sh
