name: Deploy

on:
  push:
    branches: [main, staging]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements-dev.txt
      - run: python -m pytest -q

  deploy-prod:
    needs: test
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      # appleboy/ssh-action is a Docker container action, so a file written to
      # /tmp by a plain `run:` step (which executes on the runner host) isn't
      # visible inside its container — only $GITHUB_WORKSPACE and a couple of
      # system paths are shared across that boundary. A step output, on the
      # other hand, is passed in as an env var when the container starts, so
      # it works regardless. The key itself stays base64 in the secret
      # (DEPLOY_SSH_KEY_B64) because a raw multiline secret is fragile to
      # copy-paste — a dropped newline breaks it with no useful error.
      - name: Decode deploy key
        id: decode_key
        run: |
          KEY=$(echo "${{ secrets.DEPLOY_SSH_KEY_B64 }}" | base64 -d)
          echo "key<<KEYEOF" >> "$GITHUB_OUTPUT"
          echo "$KEY" >> "$GITHUB_OUTPUT"
          echo "KEYEOF" >> "$GITHUB_OUTPUT"
      - name: Deploy to production
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.DEPLOY_HOST }}
          username: ${{ secrets.DEPLOY_USER }}
          key: ${{ steps.decode_key.outputs.key }}
          script: /home/vecherinka/deploy.sh

  deploy-staging:
    needs: test
    if: github.ref == 'refs/heads/staging'
    runs-on: ubuntu-latest
    steps:
      - name: Decode deploy key
        id: decode_key
        run: |
          KEY=$(echo "${{ secrets.DEPLOY_STAGING_SSH_KEY_B64 }}" | base64 -d)
          echo "key<<KEYEOF" >> "$GITHUB_OUTPUT"
          echo "$KEY" >> "$GITHUB_OUTPUT"
          echo "KEYEOF" >> "$GITHUB_OUTPUT"
      - name: Deploy to staging
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.DEPLOY_HOST }}
          username: ${{ secrets.DEPLOY_STAGING_USER }}
          key: ${{ steps.decode_key.outputs.key }}
          script: /home/vecherinka/deploy-staging.sh
